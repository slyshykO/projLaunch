[workspace]
members = ["git-protocol", "git-server", "git-client", "git-discovery"]
resolver = "2"

[workspace.package]
version = "0.5.1+1.gc0cd24e"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
