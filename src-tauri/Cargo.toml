[package]
name = "projlaunch"
version = "0.5.0+6.g812e9fb"
description = "Project launcher"
authors = ["Oleksiy Slyshyk <alexslyshyk@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projlaunch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git-discovery = { path = "../crates/git-discovery" }
sha2 = "0.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["sync"] }
git-protocol = { path = "../crates/git-protocol" }
git-client = { path = "../crates/git-client" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

fs-err = "3.0"
time = { version = "0.3", features = ["serde"] }
sysinfo = { version = "0.39.6", default-features = false, features = [
    "system",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }


[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 16 # Allows LLVM to perform better optimization.
lto = true         # Enables link-time-optimizations.
opt-level = "s"    # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"    # Higher performance by disabling panic handlers.
strip = true       # Ensures debug symbols are removed.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
